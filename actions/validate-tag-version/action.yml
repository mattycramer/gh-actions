name: "Validate tag version"
description: "Ensure a tag follows release tag policy and optional expected version checks"
inputs:
  tag:
    description: "Optional tag name to validate (without refs/tags/). Defaults to GITHUB_REF."
    required: false
    default: ""
  tag_prefix:
    description: "Optional tag prefix to strip before parsing version"
    required: false
    default: ""
  expected_version:
    description: "Optional version to compare against"
    required: false
    default: ""
  allow_revision_suffix:
    description: "Allow common revision suffixes (ignored when comparing versions)"
    required: false
    default: "true"
  tag_regex:
    description: "Optional regex to validate tag (bash regex). Defaults to trailing 1-10 digit suffix policy."
    required: false
    default: ""
outputs:
  tag:
    description: "Resolved tag name (without refs/tags/)"
    value: ${{ steps.parse.outputs.tag }}
  tag_version:
    description: "Version extracted from tag (may include a revision suffix)"
    value: ${{ steps.parse.outputs.tag_version }}
  base_version:
    description: "Version extracted from tag without optional revision suffix"
    value: ${{ steps.parse.outputs.base_version }}
runs:
  using: "composite"
  steps:
    - id: parse
      name: Parse tag version
      shell: bash
      run: |
        set -euo pipefail
        tag_input="${{ inputs.tag }}"
        if [ -n "${tag_input}" ]; then
          tag="${tag_input}"
        else
          if [ -z "${GITHUB_REF:-}" ]; then
            echo "GITHUB_REF is not set and tag input was not provided." >&2
            exit 1
          fi
          case "${GITHUB_REF}" in
            refs/tags/*) ;;
            *)
              echo "Ref ${GITHUB_REF} is not a tag; refusing to proceed." >&2
              exit 1
              ;;
          esac
          tag="${GITHUB_REF#refs/tags/}"
        fi
        policy_regex='(^[0-9]{1,10}$|^.*[^0-9][0-9]{1,10}$)'
        prefix="${{ inputs.tag_prefix }}"
        if [ -n "${prefix}" ] && [[ "${tag}" != "${prefix}"* ]]; then
          echo "Tag ${tag} must start with ${prefix}." >&2
          exit 1
        fi
        regex="${{ inputs.tag_regex }}"
        if [ -z "${regex}" ]; then
          regex="${policy_regex}"
        fi
        if ! [[ "${tag}" =~ ${regex} ]]; then
          echo "Tag ${tag} does not match regex ${regex}." >&2
          exit 1
        fi
        if [ -n "${prefix}" ]; then
          version="${tag#${prefix}}"
          if [ -z "${version}" ]; then
            echo "Tag ${tag} does not contain a version after ${prefix}." >&2
            exit 1
          fi
        else
          version="${tag}"
        fi
        base_version="${version}"
        if [ "${{ inputs.allow_revision_suffix }}" = "true" ]; then
          if [[ "${version}" =~ ^(.+)-r[0-9]+(-[0-9]+)?$ ]]; then
            base_version="${BASH_REMATCH[1]}"
          elif [[ "${version}" =~ ^(r[0-9]+)-[0-9]+$ ]]; then
            base_version="${BASH_REMATCH[1]}"
          fi
        fi
        expected="${{ inputs.expected_version }}"
        if [ -n "${expected}" ] && [ "${base_version}" != "${expected}" ]; then
          echo "Tag version ${base_version} does not match expected ${expected}." >&2
          exit 1
        fi
        echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
        echo "tag_version=${version}" >> "${GITHUB_OUTPUT}"
        echo "base_version=${base_version}" >> "${GITHUB_OUTPUT}"
