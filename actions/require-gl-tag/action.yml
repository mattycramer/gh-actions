name: "Require release tag"
description: "Ensure the workflow is running on a tag with a trailing 1-10 digit suffix"
inputs:
  tag:
    description: "Optional tag name to validate (without refs/tags/). Defaults to GITHUB_REF."
    required: false
    default: ""
  tag_prefix:
    description: "Optional required tag prefix"
    required: false
    default: ""
  tag_regex:
    description: "Optional regex the tag must match (bash regex). Defaults to trailing 1-10 digit suffix policy."
    required: false
    default: ""
outputs:
  tag:
    description: "Resolved tag name (without refs/tags/)"
    value: ${{ steps.resolve.outputs.tag }}
runs:
  using: "composite"
  steps:
    - id: resolve
      name: Validate release tag
      shell: bash
      run: |
        set -euo pipefail
        tag_input="${{ inputs.tag }}"
        if [ -n "${tag_input}" ]; then
          tag="${tag_input}"
        else
          if [ -z "${GITHUB_REF:-}" ]; then
            echo "GITHUB_REF is not set and tag input was not provided." >&2
            exit 1
          fi
          case "${GITHUB_REF}" in
            refs/tags/*) ;;
            *)
              echo "Ref ${GITHUB_REF} is not a tag; refusing to proceed." >&2
              exit 1
              ;;
          esac
          tag="${GITHUB_REF#refs/tags/}"
        fi
        policy_regex='(^[0-9]{1,10}$|^.*[^0-9][0-9]{1,10}$)'
        prefix="${{ inputs.tag_prefix }}"
        if [ -n "${prefix}" ] && [[ "${tag}" != "${prefix}"* ]]; then
          echo "Tag ${tag} must start with ${prefix}." >&2
          exit 1
        fi
        regex="${{ inputs.tag_regex }}"
        if [ -z "${regex}" ]; then
          regex="${policy_regex}"
        fi
        if ! [[ "${tag}" =~ ${regex} ]]; then
          echo "Tag ${tag} does not match regex ${regex}." >&2
          exit 1
        fi
        echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
