name: Release from workflow run

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag name for the release (without refs/tags/)."
        required: true
        type: string
      tag_prefix:
        description: "Optional tag prefix to validate and strip before parsing version."
        required: false
        type: string
        default: ""
      tag_regex:
        description: "Optional regex for tag validation (bash regex). Defaults to trailing 1-10 digit suffix policy."
        required: false
        type: string
        default: ""
      allow_revision_suffix:
        description: "Allow common revision suffixes in tag."
        required: false
        type: boolean
        default: true
      expected_version:
        description: "Optional expected version to compare against."
        required: false
        type: string
        default: ""
      run_id:
        description: "Workflow run ID to fetch artifacts from."
        required: true
        type: string
      artifact_prefix:
        description: "Prefix of the workflow artifact name to download."
        required: true
        type: string
      tarball_prefix:
        description: "Prefix for the tarball file name (without version)."
        required: true
        type: string
      checksum_prefix:
        description: "Prefix for the checksum file name (without version)."
        required: true
        type: string
      release_name:
        description: "Optional release name template (use {version} placeholder)."
        required: false
        type: string
        default: ""
      bws_version:
        description: "BWS CLI version used to fetch GitHub App secrets."
        required: false
        type: string
        default: ""
      bws_sha256:
        description: "BWS CLI sha256 checksum for the selected version."
        required: false
        type: string
        default: ""
      bws_secrets:
        description: "Comma-separated BWS secret names for GitHub App auth."
        required: false
        type: string
        default: "GH_ORG_RELEASE,GH_ORG_RELEASE_APP_ID,GH_ORG_RELEASE_APP_INSTALL_ID,GH_ORG_RELEASE_APP_PEM"
      run_security_gates:
        description: "Run shared security gates before publishing."
        required: false
        type: boolean
        default: true
      security_fail_on_severity:
        description: "Dependency review severity threshold (for shared security gates)."
        required: false
        type: string
        default: high
      security_osv_scan_args:
        description: "OSV scan arguments for shared security gates."
        required: false
        type: string
        default: |-
          -r
          .
    secrets:
      token:
        description: "Optional GitHub token override."
        required: false
      BWS_ACCESS_TOKEN:
        description: "BWS access token."
        required: true
      BWS_PROJECT_ID:
        description: "BWS project id."
        required: true

jobs:
  security-gates:
    name: Shared security gates
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/security-gates.yml
    with:
      caller_event_name: workflow_run
      checkout_ref: ${{ inputs.tag }}
      enable_dependency_review: false
      enable_osv_scan: ${{ inputs.run_security_gates }}
      fail_on_severity: ${{ inputs.security_fail_on_severity }}
      osv_scan_args: ${{ inputs.security_osv_scan_args }}

  release:
    name: Publish release
    needs: security-gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Validate release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TAG_PREFIX: ${{ inputs.tag_prefix }}
          INPUT_TAG_REGEX: ${{ inputs.tag_regex }}
          INPUT_ALLOW_REVISION_SUFFIX: ${{ inputs.allow_revision_suffix }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG}"
          prefix="${INPUT_TAG_PREFIX}"
          if [ -z "${tag}" ]; then
            echo "tag input is required." >&2
            exit 1
          fi
          policy_regex='(^[0-9]{1,10}$|^.*[^0-9][0-9]{1,10}$)'
          regex="${INPUT_TAG_REGEX}"
          if [ -z "${regex}" ]; then
            regex="${policy_regex}"
          fi
          if ! [[ "${tag}" =~ ${regex} ]]; then
            echo "Tag ${tag} does not match regex ${regex}." >&2
            exit 1
          fi
          if [ -n "${prefix}" ] && [[ "${tag}" != "${prefix}"* ]]; then
            echo "Tag ${tag} must start with ${prefix}." >&2
            exit 1
          fi
          if [ -n "${prefix}" ]; then
            version="${tag#${prefix}}"
            if [ -z "${version}" ]; then
              echo "Tag ${tag} does not contain a version after ${prefix}." >&2
              exit 1
            fi
          else
            version="${tag}"
          fi
          base_version="${version}"
          if [ "${INPUT_ALLOW_REVISION_SUFFIX}" = "true" ]; then
            if [[ "${version}" =~ ^(.+)-r[0-9]+(-[0-9]+)?$ ]]; then
              base_version="${BASH_REMATCH[1]}"
            elif [[ "${version}" =~ ^(r[0-9]+)-[0-9]+$ ]]; then
              base_version="${BASH_REMATCH[1]}"
            fi
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "tag_version=${version}" >> "${GITHUB_OUTPUT}"
          echo "base_version=${base_version}" >> "${GITHUB_OUTPUT}"

      - name: Resolve GitHub App token
        id: app-token
        uses: mattycramer/gh-actions/actions/github-app-token@24fa0b1b9c20445eb84e314dde824752572595c0
        with:
          bws-access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          bws-project-id: ${{ secrets.BWS_PROJECT_ID }}
          bws-version: ${{ inputs.bws_version != '' && inputs.bws_version || vars.BWS_VERSION }}
          bws-sha256: ${{ inputs.bws_sha256 != '' && inputs.bws_sha256 || vars.BWS_SHA256 }}
          secrets: ${{ inputs.bws_secrets }}

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.token }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "GH_TOKEN is not set; cannot download artifacts." >&2
            exit 1
          fi
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts"
          resp_file="$(mktemp)"
          trap 'rm -f "${resp_file}"' EXIT
          status="$(curl -sS -o "${resp_file}" -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}")"
          if [ "${status}" != "200" ]; then
            echo "GitHub API returned status ${status} for artifacts list." >&2
            head -c 2000 "${resp_file}" >&2 || true
            exit 1
          fi
          if [ ! -s "${resp_file}" ]; then
            echo "GitHub API returned an empty response body." >&2
            exit 1
          fi
          artifact_url="$(ARTIFACT_PREFIX="${ARTIFACT_PREFIX}" python3 - "${resp_file}" <<'PY'
          import json
          import os
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              data = json.load(handle)
          prefix = os.environ["ARTIFACT_PREFIX"]
          url = ""
          for artifact in data.get("artifacts", []):
              if artifact.get("expired"):
                  continue
              name = artifact.get("name", "")
              if name.startswith(prefix):
                  url = artifact.get("archive_download_url", "")
                  break
          print(url)
          PY
          )"
          if [ -z "${artifact_url}" ]; then
            echo "No artifacts found for run ${RUN_ID} with prefix ${ARTIFACT_PREFIX}." >&2
            echo "${resp}" >&2
            exit 1
          fi
          mkdir -p packages
          curl -sS -L -H "Authorization: Bearer ${GH_TOKEN}" -o /tmp/artifact.zip "${artifact_url}"
          unzip -q /tmp/artifact.zip -d packages

      - name: Resolve artifact version
        id: artifact-version
        env:
          TARBALL_PREFIX: ${{ inputs.tarball_prefix }}
          CHECKSUM_PREFIX: ${{ inputs.checksum_prefix }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(packages/${TARBALL_PREFIX}*.tar.gz)
          checksums=(packages/${CHECKSUM_PREFIX}*.txt)
          shopt -u nullglob
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one tarball for prefix ${TARBALL_PREFIX}, found ${#tarballs[@]}." >&2
            exit 1
          fi
          if [ "${#checksums[@]}" -ne 1 ]; then
            echo "Expected exactly one checksum file for prefix ${CHECKSUM_PREFIX}, found ${#checksums[@]}." >&2
            exit 1
          fi
          tarball_name="$(basename "${tarballs[0]}")"
          checksum_name="$(basename "${checksums[0]}")"
          artifact_version="${tarball_name#${TARBALL_PREFIX}}"
          artifact_version="${artifact_version%.tar.gz}"
          checksum_version="${checksum_name#${CHECKSUM_PREFIX}}"
          checksum_version="${checksum_version%.txt}"
          if [ -z "${artifact_version}" ] || [ -z "${checksum_version}" ]; then
            echo "Failed to resolve artifact version from downloaded files." >&2
            exit 1
          fi
          if [ "${artifact_version}" != "${checksum_version}" ]; then
            echo "Tarball/checksum versions do not match (${artifact_version} vs ${checksum_version})." >&2
            exit 1
          fi
          if [ -n "${EXPECTED_VERSION}" ] && [ "${artifact_version}" != "${EXPECTED_VERSION}" ]; then
            echo "Artifact version ${artifact_version} does not match expected ${EXPECTED_VERSION}." >&2
            exit 1
          fi
          echo "version=${artifact_version}" >> "${GITHUB_OUTPUT}"

      - name: Verify artifacts
        env:
          BASE_VERSION: ${{ steps.artifact-version.outputs.version }}
          TARBALL_PREFIX: ${{ inputs.tarball_prefix }}
          CHECKSUM_PREFIX: ${{ inputs.checksum_prefix }}
        run: |
          set -euo pipefail
          tarball="${TARBALL_PREFIX}${BASE_VERSION}.tar.gz"
          checksum="${CHECKSUM_PREFIX}${BASE_VERSION}.txt"
          test -f "packages/${tarball}"
          test -f "packages/${checksum}"

      - name: Resolve release name
        id: release-name
        env:
          BASE_VERSION: ${{ steps.artifact-version.outputs.version }}
          RELEASE_TEMPLATE: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TEMPLATE}" ]; then
            name="Release v${BASE_VERSION}"
          else
            name="${RELEASE_TEMPLATE//\{version\}/${BASE_VERSION}}"
          fi
          echo "name=${name}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
        with:
          artifacts: |
            packages/${{ inputs.tarball_prefix }}${{ steps.artifact-version.outputs.version }}.tar.gz
            packages/${{ inputs.checksum_prefix }}${{ steps.artifact-version.outputs.version }}.txt
          tag: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.release-name.outputs.name }}
          generateReleaseNotes: true
          draft: false
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ steps.app-token.outputs.token || secrets.token }}

      - name: Delete workflow artifacts and caches
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "GH_TOKEN is not set; cannot delete artifacts/caches." >&2
            exit 1
          fi
          repo="${GITHUB_REPOSITORY}"
          api_base="https://api.github.com"
          page=1
          while :; do
          resp="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${api_base}/repos/${repo}/actions/artifacts?per_page=100&page=${page}")"
          ids="$(printf '%s' "${resp}" | python3 -c 'import json,sys; data=json.load(sys.stdin); print("\n".join(str(a["id"]) for a in data.get("artifacts", []) if a.get("id")))' )"
            if [ -z "${ids}" ]; then
              break
            fi
            while IFS= read -r artifact_id; do
              [ -z "${artifact_id}" ] && continue
              status="$(curl -sS -o /tmp/delete-artifact.json -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${api_base}/repos/${repo}/actions/artifacts/${artifact_id}")" || {
                  echo "Failed to delete artifact ${artifact_id}." >&2
                  exit 1
                }
              if [ "${status}" != "204" ] && [ "${status}" != "202" ]; then
                echo "Artifact delete failed for ${artifact_id} (status ${status})." >&2
                head -c 2000 /tmp/delete-artifact.json >&2 || true
                exit 1
              fi
            done <<< "${ids}"
            page=$((page + 1))
          done

          page=1
          while :; do
          cache_resp="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "${api_base}/repos/${repo}/actions/caches?per_page=100&page=${page}")"
          cache_ids="$(printf '%s' "${cache_resp}" | python3 -c 'import json,sys; data=json.load(sys.stdin); print("\n".join(str(item["id"]) for item in data.get("actions_caches", []) if item.get("id")))' )"
            if [ -z "${cache_ids}" ]; then
              break
            fi
            while IFS= read -r cache_id; do
              [ -z "${cache_id}" ] && continue
              cache_status="$(curl -sS -o /tmp/delete-cache.json -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${api_base}/repos/${repo}/actions/caches/${cache_id}")" || {
                  echo "Failed to delete cache ${cache_id}." >&2
                  exit 1
                }
              if [ "${cache_status}" != "204" ] && [ "${cache_status}" != "202" ]; then
                echo "Cache delete failed for ${cache_id} (status ${cache_status})." >&2
                head -c 2000 /tmp/delete-cache.json >&2 || true
                exit 1
              fi
            done <<< "${cache_ids}"
            page=$((page + 1))
          done
